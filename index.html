<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cb-platform-catalog</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; margin: 2rem auto; max-width: 640px; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  .game { border: 1px solid #ddd; border-radius: 12px; padding: 1rem 1.2rem; margin: 1rem 0; }
  .game h2 { margin: 0 0 .3rem; font-size: 1.1rem; }
  .meta { color: #666; font-size: .85rem; }
  a.btn { display: inline-block; margin-top: .6rem; padding: .45rem 1rem; background: #0b5cad; color: #fff; border-radius: 8px; text-decoration: none; }
  code { background: #f2f2f2; padding: .1rem .35rem; border-radius: 4px; }
</style>
</head>
<body>
<h1>cb-platform-catalog</h1>
<p>ゲームプラットフォームアプリ向けのカタログ配信ページです。アプリは <code>manifest.json</code> を取得してゲームをダウンロードします。</p>
<div id="games">読み込み中…</div>
<script>
fetch('manifest.json').then(r => r.json()).then(m => {
  const el = document.getElementById('games');
  el.innerHTML = '';
  (m.games || []).forEach(g => {
    const d = document.createElement('div');
    d.className = 'game';
    d.innerHTML = '<h2></h2><div class="meta"></div><a class="btn">ダウンロード (zip)</a>';
    d.querySelector('h2').textContent = g.title;
    d.querySelector('.meta').textContent = 'バージョン ' + g.version + ' / ' + Math.max(1, Math.round((g.sizeBytes||0)/1024)) + ' KB';
    d.querySelector('a').href = g.packageUrl;
    el.appendChild(d);
  });
}).catch(() => { document.getElementById('games').textContent = 'manifest.json を読み込めませんでした。'; });
</script>
<p style="text-align:center;margin-top:2rem;font-size:0.85rem;"><a href="privacy.html">プライバシーポリシー</a></p>
</body>
</html>
